# Minimal sharded cluster: 1 config server + 2 shards + 1 router (mongos).
# Start: docker compose up -d      Stop + delete: docker compose down -v
# Needs ~2 GB RAM free for Docker. If 'mongos' shows "Exited" after first start, run: docker compose restart mongos
services:
  cfg1:
    image: mongo:7.0
    container_name: cfg1
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27017", "--bind_ip_all"]
    volumes: ["./scripts:/scripts:ro"]
  shard1:
    image: mongo:7.0
    container_name: shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27017", "--bind_ip_all"]
    volumes: ["./scripts:/scripts:ro"]
  shard2:
    image: mongo:7.0
    container_name: shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27017", "--bind_ip_all"]
    volumes: ["./scripts:/scripts:ro"]
  mongos:
    image: mongo:7.0
    container_name: mongos
    command: ["mongos", "--configdb", "cfgrs/cfg1:27017", "--bind_ip_all", "--port", "27017"]
    restart: on-failure
    depends_on: [cfg1, shard1, shard2]
    ports: ["27030:27017"]
    volumes: ["./scripts:/scripts:ro", "./seed:/seed:ro"]
